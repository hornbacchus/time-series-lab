data:
  input_file: "data/raw/macro_yield_inputs.xlsx"
  macro_sheet: "macro"
  yield_sheet: "yields"
  macro_variables:
    real_gdp_growth:
      column: "Real GDP Growth (Q/Q SAAR)"
      units: "percent"
    headline_cpi:
      column: "Headline CPI Inflation (Q/Q annualized)"
      units: "percent"
    fed_funds_rate:
      column: "Fed Funds Rate (quarterly average)"
      units: "percent"
  # BYF-Mod-1 (2026-05-01): expanded from 10 → 34 declarative maturity
  # grid (1M-30Y; monthly under 1Y plus annual at every integer year).
  # The full 34-maturity grid is the maximum surface; runtime usage is
  # data-driven — ``data.validate_input`` auto-detects which subset of
  # these 34 is populated in the user's BondYield_Yields sheet and
  # forecasts only those maturities. PCA factor structure (3 PCs)
  # requires N>=3 populated maturities; otherwise pre-flight rejects
  # with a clear error.
  yield_variables:
    treasury_1m:
      column: "1M"
      maturity_years: 0.0833
    treasury_3m:
      column: "3M"
      maturity_years: 0.25
    treasury_6m:
      column: "6M"
      maturity_years: 0.5
    treasury_9m:
      column: "9M"
      maturity_years: 0.75
    treasury_1y:
      column: "1Y"
      maturity_years: 1.0
    treasury_2y:
      column: "2Y"
      maturity_years: 2.0
    treasury_3y:
      column: "3Y"
      maturity_years: 3.0
    treasury_4y:
      column: "4Y"
      maturity_years: 4.0
    treasury_5y:
      column: "5Y"
      maturity_years: 5.0
    treasury_6y:
      column: "6Y"
      maturity_years: 6.0
    treasury_7y:
      column: "7Y"
      maturity_years: 7.0
    treasury_8y:
      column: "8Y"
      maturity_years: 8.0
    treasury_9y:
      column: "9Y"
      maturity_years: 9.0
    treasury_10y:
      column: "10Y"
      maturity_years: 10.0
    treasury_11y:
      column: "11Y"
      maturity_years: 11.0
    treasury_12y:
      column: "12Y"
      maturity_years: 12.0
    treasury_13y:
      column: "13Y"
      maturity_years: 13.0
    treasury_14y:
      column: "14Y"
      maturity_years: 14.0
    treasury_15y:
      column: "15Y"
      maturity_years: 15.0
    treasury_16y:
      column: "16Y"
      maturity_years: 16.0
    treasury_17y:
      column: "17Y"
      maturity_years: 17.0
    treasury_18y:
      column: "18Y"
      maturity_years: 18.0
    treasury_19y:
      column: "19Y"
      maturity_years: 19.0
    treasury_20y:
      column: "20Y"
      maturity_years: 20.0
    treasury_21y:
      column: "21Y"
      maturity_years: 21.0
    treasury_22y:
      column: "22Y"
      maturity_years: 22.0
    treasury_23y:
      column: "23Y"
      maturity_years: 23.0
    treasury_24y:
      column: "24Y"
      maturity_years: 24.0
    treasury_25y:
      column: "25Y"
      maturity_years: 25.0
    treasury_26y:
      column: "26Y"
      maturity_years: 26.0
    treasury_27y:
      column: "27Y"
      maturity_years: 27.0
    treasury_28y:
      column: "28Y"
      maturity_years: 28.0
    treasury_29y:
      column: "29Y"
      maturity_years: 29.0
    treasury_30y:
      column: "30Y"
      maturity_years: 30.0
  sample:
    start: "1990-Q1"
    end: "latest"
  pca:
    n_components: 3
    component_names: ["pc1_level", "pc2_slope", "pc3_curvature"]
    reporting_maturities: ["treasury_2y", "treasury_5y", "treasury_10y", "treasury_30y"]

model:
  lags: 4
  prior: "minnesota"
  stochastic_volatility: true
  persistence_prior:
    real_gdp_growth: 0.0
    headline_cpi: 0.0
    fed_funds_rate: 1.0
    pc1_level: 1.0
    pc2_slope: 0.9
    pc3_curvature: 0.5
  hyperparameters:
    method: "fixed"   # default for --estimate; --optimize-hyperparameters and
                      # --estimate-with-optimized override to "glp_composite".
    fixed:
      lambda_1: 0.2
      lambda_2: 0.5
      lambda_3: 1.0
      lambda_sc: 1.0
      lambda_io: 1.0
    # GLP-2015 grid search. The dummy-form MDD does not depend on lambda_2;
    # it is held at the value above (or at 1.0, where dummy and moments
    # forms agree exactly). Quasi-log-spaced lambda_1 — denser at the low
    # end where the response surface is most sensitive (per Step 3
    # refinement 2).
    glp_grid:
      lambda_1: [0.025, 0.05, 0.075, 0.10, 0.15, 0.20, 0.30, 0.50]
      lambda_3: [0.5, 1.0, 1.5, 2.0]
      lambda_sc: [0.0, 0.5, 1.0, 2.0, 5.0]
      lambda_io: [0.0, 0.5, 1.0, 2.0, 5.0]
    glp_numerical:
      bounds:
        lambda_1: [0.01, 1.0]
        lambda_3: [0.1, 4.0]
        lambda_sc: [0.0, 10.0]
        lambda_io: [0.0, 10.0]
      options:
        eps: 0.001
        maxiter: 100
        ftol: 1.0e-7

estimation:
  n_draws: 10000
  n_burn: 3000
  thinning: 1
  seed: 20260427

forecast:
  horizon_default: 8
  horizon_midyear: 6
  bands: [0.16, 0.50, 0.84]

# Step 4: BGL-2015 / Waggoner-Zha conditional forecasting on
# economist projections of the macro variables.
conditioning:
  horizon: 8                        # quarters ahead
  n_paths_per_draw: 50              # paths per posterior draw
  n_draws_subsample: 1000           # cap kept-draws to this many for runtime;
                                    # null = use all (production-grade posterior).
  macro_variables:                  # which panel columns are conditioned on;
    - real_gdp_growth               # target = panel.columns minus this list.
    - headline_cpi
    - fed_funds_rate
  enforce_strict_match: true        # default per Waggoner-Zha-1999.
                                    # False enables soft match using the
                                    # projection_uncertainty stds below.
  projection_uncertainty:           # only used if enforce_strict_match=false
    real_gdp_growth: 0.5            # std (in variable's own units)
    headline_cpi: 0.3
    fed_funds_rate: 0.1
  workbook_sheet: "projections"     # sheet name in the projections workbook

# Step 5: unified input-workbook architecture. A single workbook contains
# history (macro + yields) plus up to five projection scenarios. The
# canonical CLI command is `--forecast --input bvar_inputs.xlsx --scenario X`.
unified_input:
  workbook_filename: "bvar_inputs.xlsx"
  sheet_names:
    macro_history: "macro"
    yields_history: "yields"
    projections_baseline: "projections_baseline"
    projections_scenario_1: "projections_scenario_1"
    projections_scenario_2: "projections_scenario_2"
    projections_scenario_3: "projections_scenario_3"
    projections_scenario_4: "projections_scenario_4"
    readme: "README"
  default_scenario: "baseline"
