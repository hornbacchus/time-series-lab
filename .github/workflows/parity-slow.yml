name: Reference Parity (slow)

on:
  schedule:
    # Nightly 06:00 UTC
    - cron: "0 6 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  slow:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas hierarchicalforecast pyextremes tbats arch pmdarima statsmodels pymc arviz scikit-learn hmmlearn particles

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      - name: Install full manifest R packages
        shell: Rscript {0}
        run: |
          install.packages(
            c("hts", "stochvol", "urca", "extRemes", "forecast",
              "vars", "tseries", "fable", "fabletools", "evir",
              "POT", "rugarch", "dlm", "KFAS", "quantreg", "MARSS",
              "depmixS4", "MSwM", "tsDyn"),
            repos = "https://cloud.r-project.org"
          )

      - name: Run slow-tier parity checks
        # CI exit-code policy: same as parity-fast.yml — CAVEAT
        # (harness exit 2) maps to CI green per master plan §3.3;
        # BLOCK / ERROR fail. Pre-fix this step swallowed the
        # exit code entirely (no propagation), so the workflow
        # was silently green regardless of outcome — fixed in the
        # same commit that adds the §3.3 mapping to parity-fast.yml.
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          set +e
          python -m reference_parity --tier slow --json > parity-slow.json
          exit_code=$?
          cat parity-slow.json
          if [ "$exit_code" = "2" ]; then
            echo "::notice::Harness reported CAVEAT (exit 2); per master plan §3.3 this is non-failing for CI. Mapping to exit 0."
            ci_exit=0
          else
            ci_exit=$exit_code
          fi
          exit $ci_exit

      - name: Upload parity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-slow-results
          path: parity-slow.json
