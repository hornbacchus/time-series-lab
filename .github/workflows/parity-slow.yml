name: Reference Parity (slow)

on:
  schedule:
    # Nightly 06:00 UTC
    - cron: "0 6 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  slow:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps
        # Phase 3.5 Session 1 (Item 4): aligned slow-tier install
        # matrix with fast-tier deps so all 6 slow-tier checks
        # (2b/2c MCMC SV, p3_dfm, p3_prophet, p3_tbats, p3_x13)
        # run with full coverage instead of SKIPping on missing
        # deps. Previously stale: missing prophet (genuine slow-
        # tier dep), plus harness-discovery deps (dtaidistance,
        # reservoirpy, ruptures, astropy, PyWavelets, EMD-signal,
        # pyts, xgboost, lightgbm) — every check class imports
        # at runner startup regardless of tier, so importing
        # checks fail without these even when the check itself
        # is fast-tier. torch + ewstools added for parity with
        # fast-tier check imports. p3_x13 still SKIPs gracefully
        # (X-13 binary not installable on Windows runner).
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas hierarchicalforecast pyextremes tbats arch pmdarima statsmodels pymc arviz scikit-learn hmmlearn particles torch==2.11.0 ewstools==2.1.2 ruptures astropy PyWavelets EMD-signal pyts xgboost lightgbm reservoirpy prophet dtaidistance numba pyyaml openpyxl

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      - name: Install full manifest R packages
        # Phase 3.5 Session 1 (Item 4): aligned slow-tier R install
        # matrix with fast-tier (parity-fast.yml). Adds robustbase,
        # lmtest, tempdisagg, forecastHybrid (Phase 3 Sessions
        # 12+14 fast-tier deps that also need to be present at
        # runner-discovery time on slow tier so all check classes
        # import successfully). `seasonal` (X-13) deliberately
        # omitted — requires X-13 binary; p3_x13 SKIPs gracefully.
        shell: Rscript {0}
        run: |
          install.packages(
            c("hts", "stochvol", "urca", "extRemes", "forecast",
              "vars", "tseries", "fable", "fabletools", "evir",
              "POT", "rugarch", "dlm", "KFAS", "quantreg", "MARSS",
              "depmixS4", "MSwM", "tsDyn",
              # Phase 3.5 Session 1 additions:
              "robustbase", "lmtest", "tempdisagg", "forecastHybrid",
              # Phase 4 Session 5 (BYF #1 R BVAR constant-vol
              # Pattern A.2 audit; closes BYF v1.2.0 candidate #1).
              # Surface to MANIFEST.toml + this install line per
              # P-1 §8.5 (Phase 4 S1) install-matrix gate. R BVAR
              # = Kuschnig & Vashold 2021, JSS — distinct from
              # Krueger 2018 bvars (which is unavailable on R 4.5.3).
              "BVAR",
              # Phase 4 Session 11b (B-Phase4-S5-4 install-matrix
              # operational enforcement): dtw was pinned in
              # MANIFEST.toml at Phase 3 Session 14 (Batch 10) but
              # was never added to slow-tier install lines.
              # Documentation-only pin (R dtw is not consumed by any
              # audit; p3_dtw uses Python dtaidistance as reference)
              # but per §8.5 discipline every MANIFEST package must
              # appear in slow-tier install. The validate_install_matrix.py
              # script surfaced this gap at S11b execution.
              "dtw"),
            repos = "https://cloud.r-project.org"
          )

      - name: Run slow-tier parity checks
        # CI exit-code policy: same as parity-fast.yml — CAVEAT
        # (harness exit 2) and DOCUMENTED-DIVERGENCE (harness exit
        # 4) both map to CI green per P-1 §6.4; BLOCK / ERROR
        # fail. DOCUMENTED-DIVERGENCE provision added at Phase 3.5
        # Session 1 (Item 7) — forward-provisioned; not triggered
        # by any current wrapper.
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          set +e
          python -m reference_parity --tier slow --json > parity-slow.json
          exit_code=$?
          cat parity-slow.json
          if [ "$exit_code" = "2" ]; then
            echo "::notice::Harness reported CAVEAT (exit 2); per master plan §3.3 + P-1 §6.4 this is non-failing for CI. Mapping to exit 0."
            ci_exit=0
          elif [ "$exit_code" = "4" ]; then
            echo "::notice::Harness reported DOCUMENTED-DIVERGENCE (exit 4); per P-1 §2.1 + §6.4 this is non-failing for CI (methodology-equivalent divergence, not a bug). Mapping to exit 0."
            ci_exit=0
          else
            ci_exit=$exit_code
          fi
          exit $ci_exit

      - name: Upload parity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-slow-results
          path: parity-slow.json

  # Phase 3.5 Session 6 (Item 6): Linux runner job for X-13
  # binary support. Windows runner cannot install X-13 (no
  # binary distribution); p3_x13 SKIPs gracefully there. Linux
  # has the X-13 binary via the R `x13binary` package, which
  # auto-downloads a platform-specific binary at install time.
  # Setting X13PATH to x13binary::x13path() lets statsmodels'
  # x13_arima_analysis find the same binary that R `seasonal`
  # uses — Pattern A.1 same-binary parity.
  #
  # Path investigated:
  #   (a) apt install x13as-html — package exists on Ubuntu
  #       24.04 but version pinning + binary location varies
  #       across Ubuntu releases.
  #   (b) R x13binary package — CRAN-hosted; downloads pinned
  #       binary at install; cross-version stable. SELECTED.
  #   (c) Build from US Census Bureau source — out of scope.
  #
  # Install duration: R x13binary package install is small
  # (~1-2 min including the binary download). Total Linux job
  # install fits in ~6-8 min (Python deps + R packages + x13
  # binary), so this lives in slow-tier per the >5-min rule
  # in the Session 6 prompt's Step 2 decision tree.
  slow-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps (Linux)
        # Mirrors Windows install matrix. torch installed via
        # pytorch.org cpu index URL (Linux default would pull
        # CUDA wheel; we don't have GPU on GitHub-hosted
        # ubuntu-latest runners and don't need GPU acceleration
        # for parity checks anyway).
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install numpy scipy pandas hierarchicalforecast pyextremes tbats arch pmdarima statsmodels pymc arviz scikit-learn hmmlearn particles ewstools==2.1.2 ruptures astropy PyWavelets EMD-signal pyts xgboost lightgbm reservoirpy prophet dtaidistance numba pyyaml openpyxl

      - name: Install system libraries for R package compilation (libcurl/libssl/libxml2)
        # Post-Phase-5-cycle-close operational hygiene per
        # B-Phase5-POST-CLOSE-PARITY-SLOW-LINUX-PROVISIONING-FRAGILITY.
        # R packages quantmod/tseries/tsDyn (slow-tier exclusive)
        # depend transitively on R `curl` package which compiles
        # from source on Linux and requires libcurl4-openssl-dev
        # system headers. Ubuntu runner does not include these by
        # default; install before R setup to prevent curl-cascade
        # failure during R package install. libssl-dev + libxml2-dev
        # added defensively for analogous compile-time dependencies
        # in the R package install set.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      - name: Install full manifest R packages + X-13 binary
        # Adds x13binary + seasonal vs the Windows job. The
        # `x13binary` package downloads a platform-specific X-13
        # binary at install time; `seasonal` wraps it. Both
        # Linux + macOS binaries are CRAN-hosted; Windows binary
        # exists too but bundles into a non-functional install
        # path on the windows-latest runner (deferred).
        shell: Rscript {0}
        run: |
          install.packages(
            c("hts", "stochvol", "urca", "extRemes", "forecast",
              "vars", "tseries", "fable", "fabletools", "evir",
              "POT", "rugarch", "dlm", "KFAS", "quantreg", "MARSS",
              "depmixS4", "MSwM", "tsDyn",
              "robustbase", "lmtest", "tempdisagg", "forecastHybrid",
              # Phase 3.5 Session 6: X-13 binary support on Linux
              "x13binary", "seasonal",
              # Phase 4 Session 5 (BYF #1 R BVAR constant-vol
              # Pattern A.2). Mirrored from Windows install line
              # per P-1 §8.5 install-matrix gate (Phase 3.5 S1
              # Item 4 protocol: slow-tier install must mirror
              # fast-tier across both Windows + Linux jobs).
              "BVAR",
              # Phase 4 Session 11b (B-Phase4-S5-4 install-matrix
              # operational enforcement): dtw mirrored from Windows
              # job per §8.5 four-surface gate. See parity-slow.yml
              # Windows job for the same dtw entry's context.
              "dtw"),
            repos = "https://cloud.r-project.org"
          )

      - name: Resolve X-13 binary path (export TSL_X13_BINARY_PATH)
        # PHASE 4 SESSION 2 (2026-05-01) — P4-2 pathway (c) closure.
        #
        # Phase 3.5 Session 6.5 originally deferred Linux p3_x13
        # support due to a statsmodels.x13_arima_analysis vs
        # x13ashtml incompatibility (statsmodels expects .err
        # files at a specific temp prefix; x13ashtml produces
        # them elsewhere; statsmodels raised "Fixture file
        # missing" on the WIP-3 CI run). Phase 3.5 deferral
        # text: "Phase 4 may revisit statsmodels-x13ashtml
        # integration."
        #
        # Phase 4 S2 closes the deferral via pathway (c) bypass:
        # ``p3_x13.py:run_tsl`` no longer invokes statsmodels.
        # It now invokes TSL's actual wrapper
        # (``engine/techniques/x13_seasonal_adjust.py:run``),
        # which does direct x13ashtml invocation +
        # .d10/.d11/.d12/.d13 parsing and is fully x13ashtml-
        # compatible.
        #
        # This step exports TSL_X13_BINARY_PATH so that TSL's
        # ``_find_x13_binary()`` discovers x13ashtml at the path
        # where the R x13binary package installed it. The env
        # var is the highest-priority search location per the
        # Phase 4 S2 amendment to the wrapper's binary-discovery
        # logic.
        shell: bash
        run: |
          X13_DIR=$(Rscript -e 'cat(x13binary::x13path())')
          echo "x13binary install resolved at: $X13_DIR"
          ls -la "$X13_DIR"
          if [ -f "$X13_DIR/x13ashtml" ] && [ ! -e "$X13_DIR/x13as" ]; then
            ln -s x13ashtml "$X13_DIR/x13as"
            echo "Created symlink: $X13_DIR/x13as -> x13ashtml"
          fi
          # Persist X13_DIR for the next step's env block.
          echo "TSL_X13_BINARY_PATH=$X13_DIR" >> "$GITHUB_ENV"
          echo "TSL_X13_BINARY_PATH set; TSL wrapper's _find_x13_binary will discover x13ashtml here."

      - name: Run slow-tier parity checks (Linux)
        # Phase 4 S2: p3_x13 now PASSes on Linux (was
        # SKIP-graceful per Phase 3.5 S6.5 deferral). TSL's
        # wrapper finds x13ashtml via TSL_X13_BINARY_PATH and
        # invokes it directly; ``p3_x13.py:run_tsl`` reads the
        # X-13 Decomposition table from TSL's response
        # rather than calling statsmodels.
        # Other slow-tier checks (2b/2c MCMC SV, p3_dfm,
        # p3_prophet, p3_tbats) continue to provide
        # cross-platform validation.
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          set +e
          python -m reference_parity --tier slow --json > parity-slow-linux.json
          exit_code=$?
          cat parity-slow-linux.json
          if [ "$exit_code" = "2" ]; then
            echo "::notice::Harness reported CAVEAT (exit 2); per master plan §3.3 + P-1 §6.4 this is non-failing for CI. Mapping to exit 0."
            ci_exit=0
          elif [ "$exit_code" = "4" ]; then
            echo "::notice::Harness reported DOCUMENTED-DIVERGENCE (exit 4); per P-1 §2.1 + §6.4 this is non-failing for CI (methodology-equivalent divergence, not a bug). Mapping to exit 0."
            ci_exit=0
          else
            ci_exit=$exit_code
          fi
          exit $ci_exit

      - name: Upload parity result (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-slow-linux-results
          path: parity-slow-linux.json
