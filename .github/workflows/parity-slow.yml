name: Reference Parity (slow)

on:
  schedule:
    # Nightly 06:00 UTC
    - cron: "0 6 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  slow:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas hierarchicalforecast pyextremes tbats arch pmdarima statsmodels pymc arviz

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      - name: Install full manifest R packages
        shell: Rscript {0}
        run: |
          install.packages(
            c("hts", "stochvol", "urca", "extRemes", "forecast",
              "vars", "tseries", "fable", "fabletools", "evir",
              "POT", "rugarch", "dlm", "KFAS", "quantreg"),
            repos = "https://cloud.r-project.org"
          )

      - name: Run slow-tier parity checks
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          python -m reference_parity --tier slow --json > parity-slow.json
          cat parity-slow.json

      - name: Upload parity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-slow-results
          path: parity-slow.json
