name: Reference Parity (fast)

on:
  pull_request:
  push:
    branches: [master]

jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps
        # torch 2.11.0 needed for 3f Transformer attention parity
        # (.pt fixture loading via FixtureLoader._load_pt; added in
        # commit 41a4a95 Phase 2 Session 3b). MANIFEST.toml pins
        # 2.11.0+cpu locally; PyPI default install resolves to the
        # CPU wheel on Windows runner without CUDA.
        # ewstools 2.1.2 needed for critical_slowing_down parity
        # (added in commit 94742fe).
        # pmdarima needed by p3_arima_manual (its TSL wrapper
        # `engine/techniques/arima.py` imports `pmdarima as pm`
        # at module top — without pmdarima, importing the wrapper
        # raises ImportError inside run_tsl(), surfacing as ERROR
        # outcome rather than the more graceful SKIP that
        # RPackageMissingError-class import failures get).
        # arch (Python) needed by p3_sgarch / p3_gjr_garch /
        # p3_egarch (Phase 3 Session 6 GARCH-family parity checks;
        # added in commit 853e1e6). Without it those checks SKIP
        # in CI, which is informative-but-not-failure semantically;
        # we install it to keep CI exercising the full Phase 3
        # fast-tier coverage.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas hierarchicalforecast statsmodels torch==2.11.0 ewstools==2.1.2 pmdarima arch scikit-learn

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      - name: Install fast-tier R packages
        # Subset matching the fast tier of MANIFEST.toml. Slow
        # tier (full 15 packages) lives in parity-slow.yml.
        # Per-check R dependencies:
        #   hts       -> 3e_mint_family
        #   vars      -> 1c_bvar_irf_fevd
        #   urca      -> 3d_johansen_bartlett
        #   extRemes  -> 3c_evt_ferro_segers
        #   dlm,KFAS  -> 2a_kalman_filter_smoother (dual ref)
        #   forecast  -> Phase 3 Batch 1 (p3_arima / p3_sarima /
        #                p3_arimax_sarimax / p3_ets / p3_theta /
        #                p3_intermittent / p3_classical_decompose /
        #                p3_stl / p3_mstl rely on forecast::Arima,
        #                forecast::ets, forecast::thetaf,
        #                forecast::croston, forecast::mstl); also
        #                base R stats::stl + stats::decompose.
        #   rugarch   -> Phase 3 Session 6 GARCH-family parity
        #                (p3_sgarch / p3_gjr_garch / p3_egarch).
        #                Added in commit 853e1e6; CI install added
        #                in this commit (the fix for the run-fail
        #                emails on Sessions 4-6 pushes).
        shell: Rscript {0}
        run: |
          install.packages(
            c("hts", "forecast", "vars", "urca", "extRemes",
              "dlm", "KFAS", "rugarch", "MARSS"),
            repos = "https://cloud.r-project.org"
          )

      - name: Run fast-tier parity checks
        # set +e + capture exit code so JSON contents are visible in
        # the workflow log (debuggability) while preserving the
        # non-zero exit code for proper workflow status. Without this
        # wrapper, the --json redirect + bash set -e silenced all
        # diagnostic output on failure (Phase 0 D5 Tier 4 finding).
        #
        # CI exit-code policy (per master plan §3.3 — "PASS and
        # CAVEAT verdicts both run in CI"):
        #   harness exit 0 = PASS / SKIP only        → CI green
        #   harness exit 2 = CAVEAT (no BLOCK/ERROR) → CI green
        #     (CAVEAT is the documented verdict for "matches
        #     except in stated regime" — STL / MSTL deterministic
        #     impl-divergence are PASS-class outcomes per §3.1
        #     and must not fail the CI gate)
        #   harness exit 1 = BLOCK                   → CI red
        #   harness exit 3 = ERROR                   → CI red
        # Translation happens here, not in the runner — the
        # runner's exit-code semantics remain debug-friendly for
        # local invocation.
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          set +e
          python -m reference_parity --tier fast --json > parity-fast.json
          exit_code=$?
          cat parity-fast.json
          # Map CAVEAT (exit 2) → 0 per §3.3 CI exit-code policy.
          # Pass through 0 (PASS/SKIP), 1 (BLOCK), 3 (ERROR) as-is.
          if [ "$exit_code" = "2" ]; then
            echo "::notice::Harness reported CAVEAT (exit 2); per master plan §3.3 this is non-failing for CI. Mapping to exit 0."
            ci_exit=0
          else
            ci_exit=$exit_code
          fi
          exit $ci_exit

      - name: Upload parity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-fast-results
          path: parity-fast.json
