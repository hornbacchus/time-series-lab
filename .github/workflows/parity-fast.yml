name: Reference Parity (fast)

on:
  pull_request:
  push:
    branches: [master]

jobs:
  fast:
    runs-on: windows-latest
    # Phase 3.5 Session 6: bumped from 10 to 15 min. Fast-tier
    # was intermittently brushing the 10-min ceiling (8-9 min
    # typical; 10m24s hit cancellation once on commit fad9013).
    # 15 min gives stable headroom without enabling slow-tier-
    # class work.
    # Phase 4b: bumped 15 -> 20. The knob-gap discrimination
    # checks (horizon / tier1 / tier2 / confidence_level /
    # garch-mean exposure, ~2-3 min) grew the suite to ~13-15 min;
    # runner variance tipped it over 15 (9d48532 hit 15m20s
    # cancellation). Same phenomenon as the 10->15 bump (the suite
    # grew because we ADDED validation), same response. 20 gives
    # real headroom (not another knife-edge) while keeping every
    # check on the per-push tier.
    # H1: bumped 20 -> 30. Pinning to the validated environment un-SKIPs
    # p3_byf_coef_crosspkg (BVAR), p3_conformal_cqr (MAPIE), p3_star and
    # p3_tar_setar (tsDyn), and adds the verify + self-test steps: the suite
    # grew because checks that had silently stopped running run again.
    # Typical ~18 min; the worst observed install (526 s) would leave only
    # ~2 min under 25, so 30 - the same response as the earlier bumps.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # H1 / DP1: the dev interpreter that validated the engine and the
          # interpreter build_pack ships (tools/build_pack.ps1 $pyVersion).
          python-version: "3.14.3"

      - name: Validate install-matrix consistency (P-1 §8.5)
        # Phase 4 Session 11b: operational enforcement of P-1 §8.5
        # install-matrix gate. Belt-and-suspenders pattern — local
        # pre-commit hook catches gaps before commit; this CI step
        # catches gaps if the local hook missed (or wasn't
        # installed). Runs BEFORE pip install so a missing entry
        # fails fast without the slow-but-doomed install attempt.
        # See B-Phase4-S5-4 banked observation; S5 self-validating-
        # irony case study (P-1 §13.5.4).
        run: python tools/validate_install_matrix.py

      - name: Install-matrix self-test
        # H1: every validator rule (incl. the DP1 pinning rules) must be
        # able to fire; tools/test_validate_install_matrix.py plants each
        # violation. Stdlib only, so it runs before the installs.
        run: python tools/test_validate_install_matrix.py

      - name: Install Python deps
        # torch 2.11.0 needed for 3f Transformer attention parity
        # (.pt fixture loading via FixtureLoader._load_pt; added in
        # commit 41a4a95 Phase 2 Session 3b). MANIFEST.toml pins
        # 2.11.0+cpu locally; PyPI default install resolves to the
        # CPU wheel on Windows runner without CUDA.
        # ewstools 2.1.2 needed for critical_slowing_down parity
        # (added in commit 94742fe).
        # pmdarima needed by p3_arima_manual (its TSL wrapper
        # `engine/techniques/arima.py` imports `pmdarima as pm`
        # at module top — without pmdarima, importing the wrapper
        # raises ImportError inside run_tsl(), surfacing as ERROR
        # outcome rather than the more graceful SKIP that
        # RPackageMissingError-class import failures get).
        # arch (Python) needed by p3_sgarch / p3_gjr_garch /
        # p3_egarch (Phase 3 Session 6 GARCH-family parity checks;
        # added in commit 853e1e6). Without it those checks SKIP
        # in CI, which is informative-but-not-failure semantically;
        # we install it to keep CI exercising the full Phase 3
        # fast-tier coverage.
        # ruptures needed by p3_pelt (Phase 3 Session 10 PELT
        # change-point parity; same-library self-test). Without
        # it the TSL wrapper itself fails to import.
        # Phase 3 Session 11 (Batch 7 spectral) deps:
        #   - astropy: p3_lomb_scargle reference (Pattern J)
        #   - PyWavelets (pywt): p3_wavelet_transform +
        #     p3_wavelet_coherence (TSL wrapper imports + reference)
        #   - PyEMD: p3_emd_hht reference (different library from
        #     TSL; Pattern J / NO-REFERENCE Tier C)
        #   - pyts: documented but unused this batch (SSA built
        #     via from-scratch numpy SVD reference per Session 11
        #     plan); kept for potential Batch 8 dispatch.
        # Phase 3 Session 12 (Batch 8 Python ML) deps:
        #   - lightgbm: p3_lightgbm reference (same-library
        #     self-test). xgboost already in matrix from prior
        #     session.
        # Phase 3 Session 13 (Batch 9 Python DL) deps:
        #   - reservoirpy: p3_esn reference (same-library)
        #   - prophet: p3_prophet reference (same-library; tier=slow)
        #   torch already in matrix from prior session;
        #   neuralforecast / gpytorch / mapie ruled out:
        #     * neuralforecast 0.1.0 incompatible with Python 3.14
        #       (pl.utilities.distributed AttributeError);
        #     * GPyTorch ruled out — TSL gp_forecast actually uses
        #       sklearn.gaussian_process not GPyTorch;
        #     * MAPIE ruled out — TSL conformal_intervals uses
        #       custom split-conformal on pmdarima base; self-
        #       parity reference suffices.
        # Phase 3 Session 14 (Batch 10 misc / final) deps:
        #   - dtaidistance: p3_dtw reference
        # Bond Yield Forecast Session 5 deps:
        #   - numba: @jit(cache=True) on FFBS state sampling +
        #     conditional-forecast inner loop in the migrated
        #     subpackage at engine/techniques/bond_yield_forecast/.
        #   - pyyaml: default.yaml config loading.
        #   - openpyxl: unified-workbook .xlsx I/O.
        # The p3_bond_yield_forecast audit runs at reduced chain
        # config (n_draws=2000, n_burn=500) for ~20s wall-clock
        # — fits inside the 30s fast-tier budget. Plan §5.2
        # initially assumed slow-tier classification based on
        # default-chain 40s wall-clock; the audit's reduced-chain
        # design avoids that ceiling. See Session 5 findings doc.
        #
        # H1 (2026-09-30) — DP1: every environment that certifies the
        # engine runs the validated versions. The package list above used
        # to be installed UNPINNED; CI went red on statsmodels 0.15.0
        # (grangercausalitytests lost `verbose`) and ran an environment we
        # never ship. Every package now comes from lock files that mirror
        # the dev interpreter exactly:
        #   engine/requirements.lock.txt, engine/requirements.optional.lock.txt
        #     (the engine locks; build_pack installs the same files), and
        #   tools/reference_parity/requirements.harness.lock.txt (reference
        #     packages + their whole closure, generated from the dev
        #     interpreter by tools/reference_parity/make_harness_lock.py —
        #     never a fresh resolve; adds MAPIE for p3_conformal_cqr).
        # torch is the PyTorch-index CPU build (2.11.0+cpu, as on the dev
        # interpreter), installed first without deps; the lock then pins
        # its dependencies. The drift canary job below runs the same suite
        # against the latest unpinned versions, without gating.
        # --no-deps: the locks ARE the whole closure (make_harness_lock
        # walks every installed requirement), and the validated interpreter
        # itself is not resolver-consistent - it runs particles 0.4, which
        # declares numpy<2, on numpy 2.4.4 (p3_particle_filter PASSes on
        # it). pip's resolver refuses that set (ResolutionImpossible), and
        # the old unpinned install had silently fallen back to particles
        # 0.3 built from source. The verify step below proves the result
        # is exactly the locks: nothing missing, nothing extra.
        run: |
          python -m pip install pip==25.3
          python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python -m pip install --no-deps -r engine/requirements.lock.txt -r engine/requirements.optional.lock.txt -r tools/reference_parity/requirements.harness.lock.txt

      - name: Verify the validated Python environment
        # Fails if any pin is installed at another version, if anything no
        # lock pins got installed (an unvalidated package), or if any
        # requirement of a pinned package (extras honoured) is pinned by no
        # lock - the completeness pass that proves --no-deps installed the
        # whole closure.
        run: python tools/check_pinned_env.py --extras fail --lock engine/requirements.lock.txt --lock engine/requirements.optional.lock.txt --lock tools/reference_parity/requirements.harness.lock.txt

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      - name: Install fast-tier R packages
        # Subset matching the fast tier of MANIFEST.toml. Slow
        # tier (full 15 packages) lives in parity-slow.yml.
        # Per-check R dependencies:
        #   hts       -> 3e_mint_family
        #   vars      -> 1c_bvar_irf_fevd
        #   urca      -> 3d_johansen_bartlett
        #   extRemes  -> 3c_evt_ferro_segers
        #   dlm,KFAS  -> 2a_kalman_filter_smoother (dual ref)
        #   forecast  -> Phase 3 Batch 1 (p3_arima / p3_sarima /
        #                p3_arimax_sarimax / p3_ets / p3_theta /
        #                p3_intermittent / p3_classical_decompose /
        #                p3_stl / p3_mstl rely on forecast::Arima,
        #                forecast::ets, forecast::thetaf,
        #                forecast::croston, forecast::mstl); also
        #                base R stats::stl + stats::decompose.
        #   rugarch   -> Phase 3 Session 6 GARCH-family parity
        #                (p3_sgarch / p3_gjr_garch / p3_egarch).
        #                Added in commit 853e1e6; CI install added
        #                in this commit (the fix for the run-fail
        #                emails on Sessions 4-6 pushes).
        #   BVAR      -> p3_byf_coef_crosspkg (H1: it SKIPped in CI
        #                on "BVAR missing"; PASSes on the dev machine)
        # H1: every package comes from the Posit Package Manager
        # snapshot of 2026-06-01, whose Windows binaries equal the dev
        # machine's validated versions (MANIFEST.toml [r.packages]).
        # "Latest CRAN" drifted (rugarch 1.5.6, tseries 0.10.63) and
        # lost tsDyn outright: CRAN archived it between 2026-08-15 and
        # 2026-09-01, R's installer only WARNED, and p3_star /
        # p3_tar_setar SKIPped for a month. The next step fails the job
        # if any listed package is absent.
        shell: Rscript {0}
        run: |
          install.packages(
            c("hts", "forecast", "vars", "urca", "extRemes",
              "dlm", "KFAS", "rugarch", "MARSS",
              "depmixS4", "MSwM", "tsDyn",
              # Phase 3 Session 12 (Batch 8): robustbase for
              # p3_robust_estimators (Qn / MAD reference);
              # quantreg already in matrix.
              "robustbase",
              # Phase 3 Session 14 (Batch 10 misc/final):
              # lmtest (granger), tempdisagg (denton-cholette),
              # forecastHybrid (forecast-combination cross-check).
              # `seasonal` (X-13) deliberately omitted — requires
              # X-13 binary; p3_x13 SKIPs gracefully.
              "lmtest", "tempdisagg", "forecastHybrid",
              "BVAR"),
            repos = "https://packagemanager.posit.co/cran/2026-06-01"
          )

      - name: Verify the R packages
        run: python tools/check_pinned_env.py --r-packages hts,forecast,vars,urca,extRemes,dlm,KFAS,rugarch,MARSS,depmixS4,MSwM,tsDyn,robustbase,lmtest,tempdisagg,forecastHybrid,BVAR

      - name: Run fast-tier parity checks
        # set +e + capture exit code so JSON contents are visible in
        # the workflow log (debuggability) while preserving the
        # non-zero exit code for proper workflow status. Without this
        # wrapper, the --json redirect + bash set -e silenced all
        # diagnostic output on failure (Phase 0 D5 Tier 4 finding).
        #
        # CI exit-code policy (per master plan §3.3 + P-1 §6.4 +
        # Phase 3.5 Session 1 Item 7 DOCUMENTED-DIVERGENCE
        # provision):
        #   harness exit 0 = PASS / SKIP only           → CI green
        #   harness exit 1 = BLOCK                      → CI red
        #   harness exit 2 = CAVEAT (no BLOCK/ERROR)    → CI green
        #     (CAVEAT is the documented verdict for "matches
        #     except in stated regime" — STL / MSTL deterministic
        #     impl-divergence are PASS-class outcomes per §3.1
        #     and must not fail the CI gate)
        #   harness exit 3 = ERROR                      → CI red
        #   harness exit 4 = DOCUMENTED-DIVERGENCE      → CI green
        #     (Phase 3.5 Session 1 forward-provision; methodology-
        #     equivalent divergence per P-1 §2.1; not yet
        #     triggered by any current wrapper)
        # Translation happens here, not in the runner — the
        # runner's exit-code semantics remain debug-friendly for
        # local invocation.
        #
        # H1: unbuffered + faulthandler + --progress, as in
        # tools/ci_gate_local.ps1: every check is bracketed by
        # "[parity] start/done" lines on stderr, so a run that dies
        # mid-way names the check it died in.
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          set +e
          python -u -X faulthandler -m reference_parity --tier fast --json --progress > parity-fast.json
          exit_code=$?
          cat parity-fast.json
          # Map CAVEAT (exit 2) and DOCUMENTED-DIVERGENCE (exit 4)
          # → 0 per P-1 §6.4. Pass through 0 (PASS/SKIP), 1
          # (BLOCK), 3 (ERROR) as-is.
          if [ "$exit_code" = "2" ]; then
            echo "::notice::Harness reported CAVEAT (exit 2); per master plan §3.3 + P-1 §6.4 this is non-failing for CI. Mapping to exit 0."
            ci_exit=0
          elif [ "$exit_code" = "4" ]; then
            echo "::notice::Harness reported DOCUMENTED-DIVERGENCE (exit 4); per P-1 §2.1 + §6.4 this is non-failing for CI (methodology-equivalent divergence, not a bug). Mapping to exit 0."
            ci_exit=0
          else
            ci_exit=$exit_code
          fi
          exit $ci_exit

      - name: Record the environment (for the drift canary)
        if: always()
        shell: bash
        run: |
          python -m pip freeze --all > env-pinned.txt
          Rscript -e 'ip <- installed.packages(); cat(sprintf("R:%s==%s\n", ip[, "Package"], ip[, "Version"]), sep = "")' >> env-pinned.txt

      - name: Upload parity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-fast-results
          path: |
            parity-fast.json
            env-pinned.txt

      - name: Catalog key-alignment guard
        # Structural backstop (NOT numerical parity): asserts every dialog
        # control in techniques_catalog.json is read by its technique's engine
        # get_param. Exits non-zero on a NEW inert control beyond the documented
        # KNOWN_INERT baseline (the inert-control defect class — a dialog control
        # whose value is silently dropped). See
        # tools/reference_parity/catalog_key_alignment.py.
        shell: bash
        run: |
          python tools/reference_parity/catalog_key_alignment.py

      - name: Engine unit tests (guards + conventions)
        # Runs engine/tests/ in CI -- the durability fix that closes the gap
        # that HID the sample-data scramble regression (engine tests had never
        # run in CI; only the parity harness did, and it is order-insensitive).
        # Carries the sample-data ordering+contiguity guards -- INCLUDING the
        # T1b strict row-by-row descending check that catches a lexicographic
        # scramble the endpoint-only (T1) and internally-resorting (T2/T3)
        # tests are blind to -- plus the ARIMAX/exog:null class guard, the BYF
        # draws>burn validation guard, and the identification-convention /
        # interpretation-contract checks. unittest (not pytest) keeps the dep
        # set unchanged; PYTHONPATH=tools lets test_harness import the
        # reference_parity package.
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          python -m unittest discover -s engine/tests -p "test_*.py" -t .

      - name: Harness self-tests (no silent arms)
        # H1: output-level negative controls. 3e_mint_family's
        # hierarchicalforecast arm raised on every run (under the validated
        # 1.5.1 too) while the check reported PASS; these tests force each
        # arm to fail through the real runner and require the outcome to
        # say so (CAVEAT / ERROR), after a positive control that the
        # untouched check is a clean PASS with every arm compared.
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          python -m unittest discover -s tools/reference_parity/tests -p "test_*.py" -v

  # ---------------------------------------------------------------------
  # Drift canary (H1). NEVER GATES. The same fast tier against the LATEST
  # unpinned packages (Python 3.14.x, PyPI, CRAN), so the next lock refresh
  # arrives with a list of what it will change instead of a red gate: the
  # statsmodels 0.15.0 break sat red for a day before anyone looked.
  # validate_install_matrix exempts everything below this job marker from
  # its pinning rules on purpose. The parity step always exits 0 and both
  # jobs are continue-on-error; drift shows as warnings + a job summary.
  # ---------------------------------------------------------------------
  canary:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (latest 3.14.x)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the latest (unpinned) Python packages
        # The same roots as tools/reference_parity/make_harness_lock.py
        # FAST_ROOTS (+ python-docx from the engine lock), resolved fresh.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy scipy pandas hierarchicalforecast statsmodels ewstools pmdarima arch scikit-learn hmmlearn particles ruptures astropy PyWavelets EMD-signal pyts xgboost lightgbm reservoirpy prophet dtaidistance numba pyyaml openpyxl mapie python-docx

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install the latest R packages (CRAN)
        shell: Rscript {0}
        run: |
          install.packages(
            c("hts", "forecast", "vars", "urca", "extRemes", "dlm", "KFAS",
              "rugarch", "MARSS", "depmixS4", "MSwM", "tsDyn", "robustbase",
              "lmtest", "tempdisagg", "forecastHybrid", "BVAR"),
            repos = "https://cloud.r-project.org"
          )

      - name: Run fast-tier parity checks (latest packages; never fails)
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          set +e
          python -u -X faulthandler -m reference_parity --tier fast --json --progress > parity-canary.json
          echo "canary harness exit code: $?"
          python -m pip freeze --all > env-canary.txt
          Rscript -e 'ip <- installed.packages(); cat(sprintf("R:%s==%s\n", ip[, "Package"], ip[, "Version"]), sep = "")' >> env-canary.txt
          exit 0

      - name: Upload canary result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-canary-results
          path: |
            parity-canary.json
            env-canary.txt

  drift-summary:
    needs: [fast, canary]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # A job that failed before writing its files (e.g. the latest
      # packages no longer install - the biggest drift event there is)
      # leaves no artifact; the summary still runs and says so.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parity-fast-results
          path: pinned

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parity-canary-results
          path: canary

      - name: Summarize drift (pinned vs latest)
        if: always()
        run: >-
          python3 tools/reference_parity/drift_summary.py
          --pinned pinned/parity-fast.json --canary canary/parity-canary.json
          --pinned-env pinned/env-pinned.txt --canary-env canary/env-canary.txt
