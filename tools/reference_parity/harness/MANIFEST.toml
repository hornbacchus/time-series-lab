# Reference-parity harness manifest — Phase 2 Session 1.
#
# Pinned R + Python reference versions. The harness's
# ``--check-environment`` subcommand reads this file and reports
# divergences from the running environment. Quarterly review cadence
# (refresh.last_review / refresh.next_review) keeps the manifest
# from drifting silently as upstream packages release.
#
# Versions captured here reflect what is actually installed on
# the verifier's machine on the date of refresh.last_review.
# Per Phase 2 plan Q5: TOML format chosen for human-readability
# and stdlib parser support (Python 3.11+ tomllib).

[refresh]
last_review = "2026-04-29"
next_review = "2026-07-29"
notes = """
Phase 3.5 Session 5 quarterly re-pin. Two real drift cases
detected vs the prior 2026-04-25 baseline (both Python; 0
real R drift):

  - PyWavelets: 1.8.0 -> 1.9.0 (re-pinned). p3_wavelet_transform
    + p3_wavelet_coherence re-validated PASS at bit-exact 0.0
    max_abs_diff under 1.9.0; minor version bump did not
    perturb the orthogonal-wavelet (Daubechies db4 / Morlet)
    output.
  - forecastHybrid: 5.0.19 -> 5.1.21 (re-pinned). No wrapper
    consumes forecastHybrid yet; pinned only as documentation
    per Phase 3 Session 14 commentary. Re-pin is metadata-only.

Two cosmetic format-normalizations applied (no version
change; CRAN's hyphen-suffix renders with dot via R's
packageVersion()): robustbase 0.99-7 -> 0.99.7;
dtw 1.23-2 -> 1.23.2. Updated to match packageVersion()
output and clean --check-environment reporting; both
versions are bit-identical CRAN releases.

Selective re-validation per Session 5 prompt step 3 covered 9
sentinel wrappers spanning all major package families with at
least one wrapper that consumes the pinned package: p3_sgarch
(rugarch), p3_arima_manual (forecast), p3_local_level (KFAS),
p3_arimax_sarimax (statsmodels), p3_fft_spectrum (scipy),
p3_random_forest (sklearn), p3_lstm_gru (torch),
p3_wavelet_transform + p3_wavelet_coherence (PyWavelets —
the package with real drift). All 9 PASS unchanged from prior
baseline.

§8.1 risk 4 (re-validation surfaces regression) NOT triggered.

Next quarterly review: 2026-07-29 (3-month cadence anchored
to Phase 3.5 Session 5 close).
"""

[refresh.version_drift_risk]
# Phase 2 Session 1 manifest pins newer versions than Phase 1
# Stage A confirmed environment. Drift is uniformly patch-level
# and Session 1's 3e PoC verified at machine precision (4.66e-15)
# against hts 6.0.3 (vs Phase 1's 6.0.2). For 3e specifically,
# drift is benign.
#
# Future sessions adding parity tests for 2a / 2b / 2c / 3f / 3c /
# 1c / 3d / 3a / 3b MUST verify their Phase 1 baseline reproduces
# under the current manifest before locking the parity test's
# tolerance ladder. Especially relevant for stochvol (3.2.5 ->
# 3.2.9, MCMC tuning may have changed) and statsmodels (0.14.4
# -> 0.14.6, Kalman implementation changes possible).
#
# If a Phase 1 baseline does NOT reproduce under current
# versions, the contributor must either (a) downgrade R packages
# to Phase 1 versions and rerun the audit, or (b) document the
# drift as expected and lock the parity tolerance against the
# current-version baseline with explicit rationale.
#
# Resolved in Phase 3.3 (commit pending):
# - FixtureLoader generalized to dispatch on file extension
#   (.npz, .pt). The 3f Transformer check now uses standard
#   fixture_id; the bespoke .pt loader was removed.
# - SEED_OFFSET per-check workaround replaced by
#   ``_canonical_seed`` field inside the .npz fixture data.
#   The runner extracts canonical_seed from FixtureLoader's
#   metadata return and uses it as the effective seed for
#   first-attempt + CAVEAT-reroll seed bumping. The 2c
#   Student-t SV check no longer needs SEED_OFFSET=1.
notes = "see comment block above"

