# Tier policy — which checks run in fast vs slow workflows.
# The runner reads the per-check ``tier`` class attribute; this
# section is documentation only for now.
[tiers.fast]
description = "Smoke + closed-form / cheap MCMC checks. Target runtime under 10 minutes."
expected_techniques = ["_smoke_test", "3e_mint_family"]

[tiers.slow]
description = "Long MCMC + neural training checks. Target runtime under 30 minutes."
expected_techniques = []
